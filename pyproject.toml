[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-observatory"
version = "0.1.0"
description = "Datadog LLM Observability for GitHub Agentic Workflows: correlate agent traces with the run, PR and Markdown workflow that produced them, and catch silent failures."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # the collector itself is standard-library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aw-observatory = "aw_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
